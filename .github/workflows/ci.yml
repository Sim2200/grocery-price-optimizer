# Continuous integration: every push to main and every pull request runs the
# Python tests, the frontend type check + build, and a Docker image build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # No API key in CI: the app runs in demo mode and all LLM calls are mocked.
        run: pytest

  web:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t grocery-optimizer:ci .
      - name: Smoke test
        # Start the container and wait until /healthz and the frontend both answer.
        run: |
          docker run -d --name app -p 8000:8000 grocery-optimizer:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz && break; sleep 1; done
          curl -fs http://localhost:8000/readyz
          curl -fs http://localhost:8000/upload | grep -q 'Grocery Price Optimizer'
      - name: Container logs
        if: always()
        run: docker logs app || true

  helm:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/grocery-optimizer
      - name: Render with defaults and with autoscaling on
        run: |
          helm template grocery deploy/helm/grocery-optimizer > /dev/null
          helm template grocery deploy/helm/grocery-optimizer \
            --set autoscaling.enabled=true --set persistence.enabled=false > /dev/null

  terraform:
    name: Terraform fmt + validate (no plan, no apply)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      # -backend=false: download providers/modules only; no state, no AWS credentials needed.
      - run: terraform init -backend=false
      - run: terraform validate

  e2e:
    name: Playwright e2e + responsive + Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - run: uvicorn --factory grocery_optimizer.api.app:create_app --port 8000 &
      - run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 1; done
      - working-directory: web
        run: npx playwright test
      # Lighthouse CI against the same server: 3 mobile runs per page, median, and the budgets
      # in web/lighthouserc.json (JS and total bytes, accessibility, CLS) fail the build.
      - name: Lighthouse CI
        working-directory: web
        run: npx --yes @lhci/cli@0.15 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: web/lhci-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            web/e2e/screenshots
            web/test-results
