[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-optimizer"
version = "0.1.0"
description = "Turn grocery receipts into a per-store price database and plan the cheapest shopping trip."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Simran Kharbanda" }]
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
    "pulp>=3.3,<4",
    "pillow>=10.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Postgres driver, only needed when DATABASE_URL points at Postgres.
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
grocery = "grocery_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grocery_optimizer = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # PuLP 3.x warns that its bundled CBC solver moves to an extra in 4.0; we pin <4.
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
    # Emitted inside Starlette's TestClient, not our code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
