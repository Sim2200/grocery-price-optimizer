# Local stack:  docker compose up --build
#   app         http://localhost:8000   (API + React UI, JSON logs on stdout)
#   prometheus  http://localhost:9090   (scrapes app:8000/metrics)
#   grafana     http://localhost:3000   (anonymous viewer; "Grocery Optimizer" dashboard)
#   jaeger      http://localhost:16686  (traces, received over OTLP)
services:
  app:
    build: .
    image: grocery-optimizer:local
    ports:
      - "8000:8000"
    environment:
      GROCERY_DB: /app/var/grocery.db
      # Leave these empty for offline demo mode.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROCERY_LLM_MODEL: ${GROCERY_LLM_MODEL:-}
      OTEL_SERVICE_NAME: grocery-optimizer
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - grocery-data:/app/var   # the SQLite file survives container restarts
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"   # UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"   # accept OTLP on 4317 (gRPC) / 4318 (HTTP)

volumes:
  grocery-data:
